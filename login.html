<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Hygiene System - Login</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- Logo and title -->
        <div class="logo">
            <div class="logo-icon">🍽️</div>

            <h1>Food Hygiene System</h1>

            <p>Food Safety Assessment & Simulation</p>
        </div>


        <!-- Login Form -->
        <form id="loginForm">

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username or Email</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username or email"
                    required
                >
            </div>


            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        id="showPasswordBtn"
                    >
                        Show
                    </button>

                </div>
            </div>


            <!-- Forgot Password -->
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>


            <!-- Login Button -->
            <button type="submit" class="login-btn">
                Login
            </button>


            <!-- Message -->
            <p id="message" class="message"></p>

        </form>


        <!-- Footer -->
        <div class="login-footer">
            <p>Food Hygiene Management System</p>
            <p>&copy; 2026</p>
        </div>

    </div>


    <!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
